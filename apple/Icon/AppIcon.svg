<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3350"/>
      <stop offset="1" stop-color="#11141f"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a52"/><stop offset="1" stop-color="#c62828"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb43a"/><stop offset="1" stop-color="#e07b00"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f9bff"/><stop offset="1" stop-color="#1f5fd1"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ff08a"/><stop offset="1" stop-color="#1fae4c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824 x 824 body, centred, with a soft drop shadow -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>
  <!-- pads -->
  <g transform="translate(212 212)">
    <rect x="0"   y="0"   width="276" height="276" rx="56" fill="url(#red)"/>
    <rect x="324" y="0"   width="276" height="276" rx="56" fill="url(#amber)"/>
    <rect x="0"   y="324" width="276" height="276" rx="56" fill="url(#blue)"/>
    <!-- the lit pad -->
    <rect x="324" y="324" width="276" height="276" rx="56" fill="#3dff7a" opacity="0.55" filter="url(#glow)"/>
    <rect x="324" y="324" width="276" height="276" rx="56" fill="url(#green)"/>
    <rect x="330" y="330" width="264" height="132" rx="50" fill="#ffffff" opacity="0.12"/>
    <path d="M430 392 L430 532 L544 462 Z" fill="#ffffff" stroke="#ffffff" stroke-width="18" stroke-linejoin="round"/>
    <!-- top highlights on the other pads -->
    <rect x="6"   y="6"   width="264" height="132" rx="50" fill="#ffffff" opacity="0.12"/>
    <rect x="330" y="6"   width="264" height="132" rx="50" fill="#ffffff" opacity="0.12"/>
    <rect x="6"   y="330" width="264" height="132" rx="50" fill="#ffffff" opacity="0.12"/>
  </g>
</svg>
