# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen
#   cd apple && xcodegen generate
# The generated .xcodeproj is not committed; this file is the source of truth.
name: SportsballJukebox
options:
  bundleIdPrefix: com.sportsballjukebox
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SportsballJukebox:
    type: application
    platform: macOS
    sources:
      - path: SportsballJukebox
    info:
      path: SportsballJukebox/Info.plist
      properties:
        CFBundleDisplayName: Sportsball Jukebox
        CFBundleName: Sportsball Jukebox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_NAME: Sportsball Jukebox
        PRODUCT_BUNDLE_IDENTIFIER: com.sportsballjukebox.app
        # Rust engine (built by the pre-build script) and its C module.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/SbjEngineC
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../target/apple
        OTHER_LDFLAGS:
          - -lsbj_ffi
          - -framework AudioToolbox
          - -framework CoreAudio
          - -framework CoreMIDI
          - -framework CoreFoundation
          - -framework Foundation
          - -liconv
        # No Apple Developer account yet: ad-hoc sign (required to run on
        # Apple Silicon), no sandbox, no hardened runtime.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        # The pre-build script writes into the repo's target/ directory.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Rust engine
        script: '"$SRCROOT/../scripts/build-rust-apple.sh"'
        basedOnDependencyAnalysis: false
    scheme: {}
