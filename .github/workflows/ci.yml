name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # Per event, so a push does not cancel a manually started macOS build.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Lint and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: C API smoke test against the public header
        run: |
          cargo build -p sbj-ffi
          cc -std=c11 -Wall -Wextra -Werror crates/sbj-ffi/tests/smoke.c \
            -I crates/sbj-ffi/include target/debug/libsbj_ffi.a \
            -lpthread -ldl -lm -o smoke
          ./smoke

  # macOS minutes cost 10x on private repos, so this runs only for pull
  # requests, pushes to main, and manual runs (Actions tab -> Run workflow).
  macos:
    name: Test and build app (macOS)
    needs: linux
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.2"
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Build universal engine library
        run: scripts/build-rust-apple.sh
      - name: C API smoke test (native)
        run: |
          cc -std=c11 -Wall -Wextra -Werror crates/sbj-ffi/tests/smoke.c \
            -I crates/sbj-ffi/include target/apple/libsbj_ffi.a \
            -framework AudioToolbox -framework CoreAudio -framework CoreFoundation \
            -framework Foundation -lobjc -liconv -o smoke
          ./smoke
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd apple && xcodegen generate
      - name: Build app (universal, ad-hoc signed)
        run: |
          xcodebuild -project apple/SportsballJukebox.xcodeproj \
            -scheme SportsballJukebox -configuration Release \
            -derivedDataPath apple/build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            build > xcodebuild.log 2>&1 || {
              grep -E "error:" xcodebuild.log | head -100
              tail -40 xcodebuild.log
              exit 1
            }
          grep -E "warning:" xcodebuild.log | sort -u | head -50 || true
          tail -3 xcodebuild.log
      - name: Package app
        run: |
          app="apple/build/Build/Products/Release/Sportsball Jukebox.app"
          lipo -info "$app/Contents/MacOS/Sportsball Jukebox"
          codesign --verify --verbose "$app"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/Sportsball-Jukebox-${GITHUB_SHA::7}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Sportsball-Jukebox-macOS
          path: dist/*.zip
          retention-days: 30
      - name: Screenshots (demo show, synthesised audio)
        run: scripts/make-screenshots.sh "apple/build/Build/Products/Release/Sportsball Jukebox.app" screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          retention-days: 30
      - name: Engine benchmark
        run: cargo run --release -p sbj-engine --example bench
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
