name: CI

on:
  push:
    branches: ["**"]
    # A version tag (v0.1.0) builds the installer and publishes a release.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Per event, so a push does not cancel a manually started macOS build.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Lint and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: C API smoke test against the public header
        run: |
          cargo build -p sbj-ffi
          cc -std=c11 -Wall -Wextra -Werror crates/sbj-ffi/tests/smoke.c \
            -I crates/sbj-ffi/include target/debug/libsbj_ffi.a \
            -lpthread -ldl -lm -o smoke
          ./smoke

  # macOS minutes cost 10x on private repos, so this runs only for pull
  # requests, pushes to main, version tags, and manual runs (Actions tab
  # -> Run workflow).
  macos:
    name: Test and build app (macOS)
    needs: linux
    if: >-
      github.event_name != 'push' || github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write  # manual runs commit screenshots; tags publish releases
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.2"
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Build universal engine library
        run: scripts/build-rust-apple.sh
      - name: C API smoke test (native)
        run: |
          cc -std=c11 -Wall -Wextra -Werror crates/sbj-ffi/tests/smoke.c \
            -I crates/sbj-ffi/include target/apple/libsbj_ffi.a \
            -framework AudioToolbox -framework CoreAudio -framework CoreMIDI -framework CoreFoundation \
            -framework Foundation -lobjc -liconv -o smoke
          ./smoke
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd apple && xcodegen generate
      - name: Version
        run: |
          # v1.2.3 tags set the version; other builds are 0.1.0 + build number.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' apple/project.yml)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Version $version, build $GITHUB_RUN_NUMBER"
      - name: Build app (universal, ad-hoc signed)
        run: |
          xcodebuild -project apple/SportsballJukebox.xcodeproj \
            -scheme SportsballJukebox -configuration Release \
            -derivedDataPath apple/build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            build > xcodebuild.log 2>&1 || {
              grep -E "error:" xcodebuild.log | head -100
              tail -40 xcodebuild.log
              exit 1
            }
          grep -E "warning:" xcodebuild.log | sort -u | head -50 || true
          tail -3 xcodebuild.log
      - name: Package app (installer disk image)
        run: |
          app="apple/build/Build/Products/Release/Sportsball Jukebox.app"
          lipo -info "$app/Contents/MacOS/Sportsball Jukebox"
          codesign --verify --verbose "$app"
          test -f "$app/Contents/Resources/AppIcon.icns" || { echo "app icon missing"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" \
            -c "Print :NSLocalNetworkUsageDescription" "$app/Contents/Info.plist"
          scripts/make-dmg.sh "$app" "dist/Sportsball-Jukebox-$VERSION.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Sportsball-Jukebox-macOS
          path: dist/*.dmg
          retention-days: 30
      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v0.2.0-beta.1) is marked as a pre-release.
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Made on github.com ("Create new tag on publish"): attach.
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg $prerelease \
              --title "Sportsball Jukebox $VERSION" --notes-file docs/install.md
          fi
      - name: Screenshots (demo show, synthesised audio)
        run: scripts/make-screenshots.sh "apple/build/Build/Products/Release/Sportsball Jukebox.app" screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          retention-days: 30
      - name: Commit screenshots to the branch (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p docs/screenshots
          cp screenshots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m "Update screenshots [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "branch moved on; screenshots not committed"
          fi
      - name: Engine benchmark
        run: cargo run --release -p sbj-engine --example bench
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
