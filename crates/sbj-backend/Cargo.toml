[package]
name = "sbj-backend"
description = "Audio device abstraction for Sportsball Jukebox, plus an offline backend for tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]

# Core Audio (macOS) / WASAPI (Windows). Not built on Linux, so CI there
# needs no ALSA headers.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "0.18.2"

[dev-dependencies]
sbj-engine.workspace = true

[lints]
workspace = true
