<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111214">
<title>Sportsball Jukebox Remote</title>
<style>
  :root {
    --bg: #111214; --panel: #1c1d21; --text: #f2f2f4; --muted: #9a9ba3;
    --empty: #26272c; --playing: #2fbf55; --danger: #d63b3b; --accent: #2f7bf6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px);
  }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
  header h1 { font-size: 17px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { font-size: 12px; color: var(--muted); }
  #stopall {
    background: var(--danger); color: white; border: 0; border-radius: 10px;
    font-weight: 700; font-size: 16px; padding: 12px 18px;
  }
  #banks { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; }
  #banks button {
    background: var(--empty); color: var(--text); border: 0; border-radius: 999px;
    padding: 8px 14px; font-size: 14px; white-space: nowrap;
  }
  #banks button.current { background: var(--accent); font-weight: 600; }
  #playing { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  #rundown {
    display: none; align-items: center; gap: 10px; background: var(--panel);
    border-radius: 12px; padding: 10px; margin-bottom: 10px;
  }
  #rundown .what { flex: 1; min-width: 0; }
  #rundown .label { font-size: 12px; color: var(--muted); }
  #rundown .standby { font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #rundown .next { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #rundown button { border: 0; border-radius: 10px; color: white; }
  #rundown .step { background: #3a3b42; padding: 12px; font-size: 16px; }
  #go { background: var(--playing); font-weight: 800; font-size: 22px; padding: 14px 22px; }
  #go:disabled { opacity: 0.4; }
  .row {
    display: flex; align-items: center; gap: 10px; background: var(--panel);
    border-radius: 10px; padding: 8px 10px;
  }
  .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 20px; }
  .row .time.ending { color: #ff5a5a; }
  .row button { background: #3a3b42; color: white; border: 0; border-radius: 8px; padding: 8px 12px; }
  #grid { display: grid; gap: 8px; }
  .pad {
    position: relative; min-height: 84px; border-radius: 12px; border: 0;
    color: white; text-align: left; padding: 10px; overflow: hidden;
    font-size: 15px; font-weight: 600; background: var(--empty);
  }
  .pad.empty { color: var(--muted); font-weight: 400; }
  .pad.notready { opacity: 0.45; }
  .pad.playing { outline: 3px solid var(--playing); }
  .pad .bar { position: absolute; left: 0; bottom: 0; height: 5px; background: rgba(255,255,255,0.75); }
  .pad .bar.ending { background: #ff5a5a; }
  .pad .sub { display: block; font-size: 12px; font-weight: 400; opacity: 0.85; margin-top: 4px; }
  .pad .badge {
    position: absolute; top: 8px; right: 8px; font-size: 11px; font-weight: 800;
    background: orange; color: black; border-radius: 999px; padding: 1px 7px;
  }
  .pad:active { transform: scale(0.97); }
  #pin {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 14px; padding: 24px;
  }
  #pin input {
    font-size: 32px; letter-spacing: 8px; text-align: center; width: 220px;
    padding: 10px; border-radius: 10px; border: 0;
  }
  #pin button { font-size: 18px; padding: 12px 28px; border-radius: 10px; border: 0; background: var(--accent); color: white; }
  #pin p { color: var(--muted); text-align: center; max-width: 320px; }
</style>
</head>
<body>
<header>
  <h1 id="show">Sportsball Jukebox</h1>
  <span id="status">Connecting…</span>
  <button id="stopall">STOP ALL</button>
</header>
<nav id="banks"></nav>
<section id="rundown">
  <button class="step" id="rd-prev" aria-label="Previous step">◀</button>
  <div class="what">
    <div class="label" id="rd-label">Standby</div>
    <div class="standby" id="rd-standby"></div>
    <div class="next" id="rd-next"></div>
  </div>
  <button class="step" id="rd-next-btn" aria-label="Next step">▶</button>
  <button id="go">GO</button>
</section>
<section id="playing"></section>
<main id="grid"></main>

<div id="pin">
  <h2>Enter the PIN</h2>
  <input id="pin-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
  <button id="pin-ok">Connect</button>
  <p>The PIN is shown in Sportsball Jukebox under Control → Remote.</p>
</div>

<script>
"use strict";
const COLORS = {
  blue: "#2a6fdb", green: "#2e9e4f", orange: "#d4811b", red: "#c9373a",
  purple: "#8c44c9", pink: "#d0457f", teal: "#2b9aa6", gray: "#6b6d75",
};
// Storage can be unavailable (private browsing); the PIN is then asked
// for on each visit.
function load() { try { return localStorage.getItem("sbj-pin") || ""; } catch (e) { return ""; } }
function save(value) { try { localStorage.setItem("sbj-pin", value); } catch (e) { /* ignore */ } }
let pin = load();

/// A colour name from the app, or a custom "#RRGGBB".
function padColor(c) {
  return /^#[0-9a-f]{6}$/i.test(c || "") ? c : (COLORS[c] || COLORS.blue);
}
let state = null;
let failures = 0;

function api(method, path) {
  return fetch("/api/" + path, { method, headers: { "X-SBJ-PIN": pin } }).then((r) => {
    if (r.status === 401) { askPin(); throw new Error("pin"); }
    return r.json();
  });
}

function askPin() {
  document.getElementById("pin").style.display = "flex";
  document.getElementById("pin-input").focus();
}

document.getElementById("pin-ok").onclick = () => {
  pin = document.getElementById("pin-input").value.trim();
  save(pin);
  document.getElementById("pin").style.display = "none";
  refresh();
};
document.getElementById("pin-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("pin-ok").click();
});
document.getElementById("stopall").onclick = () => send("stopall");
document.getElementById("go").onclick = () => send("go");
document.getElementById("rd-prev").onclick = () => send("rundown/prev");
document.getElementById("rd-next-btn").onclick = () => send("rundown/next");

function send(path) {
  if (navigator.vibrate) navigator.vibrate(15);
  api("POST", path).then(refresh).catch(() => {});
}

function time(s) {
  s = Math.max(0, s);
  const m = Math.floor(s / 60);
  const r = s - m * 60;
  return m + ":" + (r < 10 ? "0" : "") + r.toFixed(1);
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// Elements are reused between refreshes (only rebuilt when the layout
// changes), so a tap never lands on a button that was just replaced.
let layout = { banks: "", playing: "", grid: "" };

function render() {
  if (!state) return;
  document.getElementById("show").textContent = state.show || "Sportsball Jukebox";
  renderBanks();
  renderRundown();
  renderPlaying();
  renderGrid();
}

function renderBanks() {
  const banks = document.getElementById("banks");
  const key = JSON.stringify(state.banks);
  if (layout.banks !== key) {
    layout.banks = key;
    banks.replaceChildren();
    if (state.banks.length > 1) {
      state.banks.forEach((name, i) => {
        const b = el("button", "", name);
        b.onclick = () => send("bank/" + (i + 1));
        banks.appendChild(b);
      });
    }
  }
  Array.from(banks.children).forEach((b, i) => b.classList.toggle("current", i === state.bank));
}

function renderRundown() {
  const box = document.getElementById("rundown");
  const r = state.rundown;
  box.style.display = r ? "flex" : "none";
  if (!r) return;
  const finished = r.standby === null;
  document.getElementById("rd-label").textContent =
    finished ? "Rundown" : "Standby · step " + r.step + " of " + r.steps;
  document.getElementById("rd-standby").textContent = finished ? "Finished" : r.standby;
  document.getElementById("rd-next").textContent = r.next ? "Next: " + r.next : "";
  document.getElementById("go").disabled = finished;
}

function renderPlaying() {
  const playing = document.getElementById("playing");
  const key = state.playing.map((p) => p.slot + (p.holding ? "h" : "")).join(",");
  if (layout.playing !== key) {
    layout.playing = key;
    playing.replaceChildren();
    state.playing.forEach((p) => {
      const row = el("div", "row");
      row.appendChild(el("span", "name"));
      row.appendChild(el("span", "time"));
      if (p.holding) {
        const go = el("button", "", "GO");
        go.onclick = () => send("fire/" + p.slot);
        row.appendChild(go);
      }
      const stop = el("button", "", "Stop");
      stop.onclick = () => send("stop/" + p.slot);
      row.appendChild(stop);
      playing.appendChild(row);
    });
  }
  state.playing.forEach((p, i) => {
    const row = playing.children[i];
    row.querySelector(".name").textContent = p.title;
    const t = row.querySelector(".time");
    t.textContent = p.holding ? "VAMP" : p.remaining === null ? "LOOP" : "-" + time(p.remaining);
    t.classList.toggle("ending", p.remaining !== null && p.remaining <= 5);
  });
}

function renderGrid() {
  const grid = document.getElementById("grid");
  const cols = Math.min(state.columns, window.innerWidth < 500 ? 3 : window.innerWidth < 900 ? 4 : state.columns);
  const key = cols + "|" + state.pads.map((p) => p.slot + (p.assigned ? "a" : "")).join(",");
  if (layout.grid !== key) {
    layout.grid = key;
    grid.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
    grid.replaceChildren();
    state.pads.forEach((p) => {
      const b = el("button", "pad");
      if (!p.assigned) {
        b.classList.add("empty");
        b.textContent = "Empty";
        b.disabled = true;
      } else {
        b.appendChild(el("span", "title"));
        b.appendChild(el("span", "sub"));
        b.appendChild(el("span", "badge", "VAMP"));
        b.appendChild(el("div", "bar"));
        b.onclick = () => send("fire/" + p.slot);
      }
      grid.appendChild(b);
    });
  }
  state.pads.forEach((p, i) => {
    if (!p.assigned) return;
    const b = grid.children[i];
    b.style.background = p.playing ? "#2f9e4c" : padColor(p.color);
    b.classList.toggle("notready", !p.ready);
    b.classList.toggle("playing", p.playing);
    b.querySelector(".title").textContent = p.title;
    const sub = b.querySelector(".sub");
    sub.textContent = p.line;
    sub.style.display = p.line ? "" : "none";
    b.querySelector(".badge").style.display = p.holding ? "" : "none";
    const bar = b.querySelector(".bar");
    bar.style.display = p.playing ? "" : "none";
    bar.style.width = Math.round(p.progress * 100) + "%";
    bar.classList.toggle("ending", p.playing && p.remaining !== null && p.remaining <= 5);
  });
}

function refresh() {
  return api("GET", "state").then((s) => {
    state = s;
    failures = 0;
    document.getElementById("status").textContent = "Live";
    render();
  }).catch((e) => {
    if (e.message !== "pin") {
      failures += 1;
      document.getElementById("status").textContent = failures > 2 ? "Offline — retrying" : "…";
    }
  });
}

// The app's QR code carries the PIN after "#pin=" (never sent to the
// server). Remember it and drop it from the address bar.
const fromLink = /(?:^#|&)pin=(\d+)/.exec(location.hash);
if (fromLink) {
  pin = fromLink[1];
  save(pin);
  history.replaceState(null, "", location.pathname);
}
if (!pin) askPin();
refresh();
setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 400);
window.addEventListener("resize", render);
</script>
</body>
</html>
