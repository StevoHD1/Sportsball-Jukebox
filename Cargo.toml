[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
rtrb = "0.4.1"
sbj-engine = { path = "crates/sbj-engine" }
sbj-backend = { path = "crates/sbj-backend" }
sbj-media = { path = "crates/sbj-media" }
sbj-session = { path = "crates/sbj-session" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
